<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PayNode: payroll, work sheets and approvals in one place</title>
    <meta name="description" content="Employees log their hours, HR verifies and requests pay, and admins approve and pay through Stripe. Every step is on record." />
    <meta name="theme-color" content="#2563eb" />
    <script>
      // Apply the saved theme before first paint to avoid a flash. Mirrors src/lib/theme.js.
      (function () {
        try {
          var saved = localStorage.getItem("paynode.theme");
          var dark = saved === "dark" || (saved !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
